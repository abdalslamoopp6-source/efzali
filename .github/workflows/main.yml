name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Find and Build Android
      run: |
        # البحث عن المجلد الذي يحتوي على gradlew وتشغيل البناء داخله
        GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \;)
        echo "Found gradle project in: $GRADLE_DIR"
        cd "$GRADLE_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug.apk
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
