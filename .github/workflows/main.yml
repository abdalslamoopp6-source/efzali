name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Find Project Root & Install Dependencies
      run: |
        PKG_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
        echo "Project root found at: $PKG_DIR"
        cd "$PKG_DIR"
        npm install
        npm run build --if-present

        npx cap add android || true
        npx cap copy android || true
        npx cap sync android || true

        CD_ANDROID=$(find . -maxdepth 3 -name "gradlew" -exec dirname {} \; | head -n 1)
        cd "$CD_ANDROID"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
